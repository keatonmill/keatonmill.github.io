- id: cannabis-handbook
  title: Up in Smoke? The Market for Cannabis
  section: Book Chapters
  status: published
  accepted: 2021-09-22
  authors:
  - benjamin-hansen
  - miller
  - caroline-weber
  outlet: Handbook of Labor, Human Resources and Population Economics
  editors: Zimmermann, K. and Marcotte, D.
  year: 2021
  links:
  - label: Published version
    url: https://link.springer.com/referenceworkentry/10.1007%2F978-3-319-57365-6_138-1
  abstract_heading: Abstract
  abstract: |-
    Legal access to recreational cannabis continues to expand across the globe. With each new market comes new legal structures and regulations. In this chapter we first review the regulations and market structures of the newly legalized recreational markets in the United States, Canada, and Uruguay. We then discuss the emerging literature on the industrial organization of the cannabis industry, which provides new evidence on market competition and the price elasticity of demand. We proceed to review the expanding research on cannabis taxation and the black market. This research has meaningful public policy conclusions for how tax rates and structures affect revenue generation and the black market, key arguments for legalization. We finish by reviewing the public health literature on legalization, and its findings on how legalization has affected cannabis use, dangerous driving, and the use and abuse of other drugs.
- id: faculty-unions
  title: Faculty Unions, Faculty Salaries, and Tuition
  section: Working Papers
  status: working
  authors:
  - miller
  - tom-ben-shahar
  links:
  - label: Paper
    url: assets/pdf/faculty-unions.pdf
    note: (September 2026)
  abstract_heading: Abstract
  abstract: |-
    Faculty unionization has expanded substantially in U.S. higher education over the past two decades. Using IPEDS data from 2004 to 2024 and a staggered difference-in-differences design, we estimate the effect of first collective bargaining agreements on faculty salaries, the composition of the instructional workforce, tuition prices, and institutional spending. We find unionization increases wages for the unionized group, and institutions adjust for these expenses by substituting labor demand towards lower-paid positions. We find no detectable change in overall spending or net tuition.
- id: foundation-transparency
  title: Do Donors Flee the Sunshine? Transparency Laws and Public University Foundation Finances
  section: Working Papers
  status: working
  authors:
  - tom-ben-shahar
  - andrew-ducharme
  - miller
  links:
  - label: Paper
    url: assets/pdf/foundation-transparency.pdf
    note: (September 2026)
  abstract_heading: Abstract
  abstract: |-
    Independent foundations play an increasing role in funding higher education, leading to calls for transparency regarding their donors and operations. Some have opposed such efforts, arguing that disclosure requirements may discourage donations and reduce endowment growth. Using panel data on public institutions from IPEDS and the foundations associated with them from IRS disclosures, we employ the difference-in-differences estimator of Callaway and Sant'Anna (2021) and estimate the causal effect of state transparency laws on both the stock of foundation assets and the flow of gifts to foundations. We also test for changes in the net price paid by in-state students and institutional expenditures. We find no statistically significant effect on any outcome, a result robust to alternative treatment definitions, sample restrictions, control compositions, and an augmented synthetic control estimator. Our design rules out severe sustained donor flight, the strongest version of the policy concern, but cannot reject more modest gift reductions. We interpret these results as evidence that transparency mandates do not produce detectable medium-run harm to foundation finances.
- id: climate-household-impacts
  title: A Method of Estimating the Impacts of Climate Change on Oregon Household Budgets
  section: Working Papers
  status: under-review
  authors:
  - miller
  links:
  - label: Paper
    url: assets/pdf/climate-household-impacts.pdf
    note: (December 2025)
  abstract_heading: Abstract
  abstract: |-
    Climate change communication faces challenges in polarized media environments. While economic framing generates stronger public engagement than health or geographical approaches, most analyses focus on macroeconomic outcomes rather than household budgets. This paper addresses that gap by estimating climate change impacts on typical Oregon household budgets. Synthesizing literature on sectoral price changes and consumer demand, I develop a translational framework making economic consequences accessible to non-experts. Results indicate that by 2050, medium-income households will experience annual welfare losses of $9,525, representing 9.1% of income. This household-level analysis helps communicate climate change’s tangible economic effects to the public.
- id: mortgage-servicer-licensing
  title: The Impacts of Mortgage Servicer Licensing Requirements
  section: Working Papers
  status: working
  authors:
  - edder-martinez-lazo
  - miller
  links:
  - label: Paper
    url: assets/pdf/mortgage-servicer-licensing.pdf
    note: (June 2024)
  abstract_heading: Abstract
  abstract: |-
    The 2007-2008 U.S. financial crisis illustrated the way in which mortgage servicers, through their role in influencing delinquencies, foreclosures, and in administering mortgage modification programs, can influence housing market outcomes at a broad scale. We study a wave of state-level mortgage servicer licensing laws passed in the wake of the crisis. We study mortgage market outcomes using a difference-in-differences approach and pooled mortgage-backed security outcomes using an exposure design. We find evidence that the reforms decreased late-stage delinquencies and foreclosures. Compliance costs may have been passed through to increased interest rates. Other borrower and loan characteristics were unchanged.
- id: short-term-rentals
  title: 'In Search of Peace and Quiet: The Heterogeneous Impacts of Short-Term Rentals on Housing Prices'
  section: Working Papers
  status: working
  authors:
  - brett-garcia
  - miller
  - john-morehouse
  links:
  - label: Paper
    url: assets/pdf/short-term-rentals.pdf
    note: (April 2022)
  abstract_heading: Abstract
  abstract: |-
    The supply of housing for short-term rental (STR) has grown dramatically with the emergence of platforms such as Airbnb. This trend has led to contradictory concerns about increasing housing prices and negative externalities. We provide evidence that in some areas, STRs can decrease housing prices. Using a parsimonious model of housing occupancy with externalities, we show the marginal effect of STRs on housing prices depends on the net impact of STRs on local amenities. Using zip-code-level data from Los Angeles County, California, we show heterogeneity in the marginal effects of Airbnb listings on housing prices across localities. We then examine the consequences of a 2015 law restricting STRs within the City of Santa Monica in the coastal region of Los Angeles County. In that City, we estimate a negative relationship between the prevalence of STRs and housing prices. Using a differences-in-differences approach, we show that the 2015 law increased housing prices -- which can be rationalized by our theory. Finally, we provide evidence for a potential mechanism: "party-related" nuisance calls to the Santa Monica Police Department decreased after the policy was enacted.
