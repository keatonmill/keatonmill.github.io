- id: medicare-advantage-v28
  title: Payment Shocks to Medicare Advantage Plans and Their Impact on Plan Generosity
  section: Journal Articles
  status: forthcoming
  authors:
  - niru-ghoshal-datta
  - michael-chernew
  - miller
  - mcwilliams
  - everhart
  - chopra
  outlet: Health Affairs
  abstract_heading: Abstract
  abstract: |-
    Beginning in 2024, CMS implemented version 28 (V28) of the Medicare Advantage (MA) risk adjustment algorithm, which altered payments to MA plans. This paper examines how these risk-adjustment changes, which were expected to reduce payments to most plans, affected plan premiums, cost sharing, and benefits. Our findings suggest that V28 did not significantly affect plan premiums, but was associated with modest increases in cost-sharing and reductions in some supplemental benefits, thus partially contributing to broader declines in supplemental benefit generosity in MA during this period. Overall, our results suggest that modest payment cuts are likely to lead to small reductions in non-premium benefits. However, the value of these foregone benefits to beneficiaries and the potential impact of larger cuts remain uncertain. Policy makers must weigh whether the fiscal savings resulting from reduced payments justify potential declines in benefit generosity, which remains higher than historical norms.
- id: optimal-managed-competition-subsidies
  title: The Optimal Geographic Distribution of Managed Competition Subsidies
  section: Journal Articles
  status: forthcoming
  authors:
  - miller
  - amil-petrin
  - robert-town
  - michael-chernew
  outlet: RAND Journal of Economics
  links:
  - label: Paper
    url: assets/pdf/managed-competition.pdf
    note: (September 2026)
  - label: Monte Carlo code
    url: s/mc_release.zip
    note: (September 2022)
  abstract_heading: Abstract
  abstract: |-
    Governments often subsidize consumers’ purchases from competing firms rather than provide goods directly. We study managed competition, where firms compete for consumers and subsidies that follow them. We develop a framework for choosing the optimal market-level subsidy schedule with heterogeneous consumers and endogenous firm prices and product characteristics. We apply it to Medicare Advantage, which offers private insurance as an alternative to Traditional Medicare. We estimate product-characteristic policy functions and solve for Nash equilibria in revenues to compute counterfactual equilibria under alternative subsidies. The consumer-welfare-maximizing budget-neutral schedule raises aggregate annual consumer welfare overall by $7 billion relative to current policy.
- id: shifting-tax-incidence
  title: 'Shifting Tax Incidence: Evidence from the Washington State Cannabis Market'
  section: Journal Articles
  status: published
  accepted: 2025-05-12
  authors:
  - benjamin-hansen
  - kendall-houghton
  - miller
  - caroline-weber
  outlet: Journal of Policy Analysis and Management
  volume: 45
  issue: 3
  pages: e70041
  year: 2026
  links:
  - label: Published version
    url: https://doi.org/10.1002/pam.70041
  - label: NBER Working Paper
    url: https://www.nber.org/papers/w23632
  abstract_heading: Abstract
  abstract: |-
    We study how prices respond when a 25% gross receipts tax remitted by cannabis manufacturers was eliminated in Washington state and the retail excise tax was simultaneously increased from 25% to 37%. Standard theory suggests that this change should have increased welfare for manufacturers, retailers, and consumers; instead, our analysis shows that the reform unexpectedly shifted benefits toward manufacturers at the expense of retailers and consumers, who faced higher tax-inclusive prices post-reform. We hypothesize that this outcome was driven by behavioral factors such as anchoring and loss aversion. Our findings add to a growing body of evidence that tax reforms can affect market outcomes in ways not predicted by standard economic models, offering a cautionary lesson for policymakers considering similar reforms.
- id: in-app-payment
  title: Early Evidence on the Effects of Open Mobile In-App Payment Systems from South Korea
  section: Journal Articles
  status: published
  accepted: 2025-12-12
  authors:
  - boyoon-chang
  - miller
  outlet: Journal of Competition Law & Economics
  pages: nhaf034
  year: 2025
  links:
  - label: Published version
    url: https://doi.org/10.1093/joclec/nhaf034
  - label: Paper
    url: s/2024-06-24-in_app_billing.pdf
    note: (June 2024 draft)
  abstract_heading: Abstract
  abstract: |-
    Mobile app platforms are highly concentrated—Apple and Google each distribute over 75% of the total number of apps installed on the relevant devices. These platforms generally require developers to use a built-in system for processing payments with a commission rate of 30% for both the initial purchase of an app and any subsequent in-app purchases. In September 2021, South Korea became the first country to ban this lock-in; purchases made in the country may be conducted through any billing system developers wish. We analyze the short-term impact of this policy change (and Apple’s subsequent adaptation) on demand for apps and revenue using difference-in-differences techniques and data on apps offered through Apple’s App Store from a leading app analytics firm from January 2021 to December 2022. We find no evidence that the policy change generated substantive changes in South Korea’s app marketplace.
- id: capturing-harvesting-medicare-advantage
  title: Capturing and Harvesting in Medicare Advantage Plan Design
  section: Journal Articles
  status: published
  accepted: 2024-05-20
  outlet: Health Affairs Scholar
  volume: 2
  issue: 6
  pages: qxae077
  year: 2024
  links:
  - label: Published version
    url: https://academic.oup.com/healthaffairsscholar/advance-article/doi/10.1093/haschl/qxae077/7687291
  abstract_heading: Abstract
  abstract: |-
    Consumers in health insurance markets have inertia stemming from the desire to maintain relationships with providers and other frictions involved in switching plans. In other markets that feature inertia, suppliers respond with pricing strategies that vary by market share: lowering markups to capture consumers when market shares are low and raising markups to harvest profits once market share has been established. I tested for this behavior in the Medicare Advantage (MA) market by examining how MA plan sponsors changed the financial terms of their plans in response to changes in market share from 2007 to 2021 using a first-difference model with fixed effects. I found evidence that plans increase premiums, copays, and out-of-pocket limits when market shares increase. The results imply that for every 1% increase in market share, plan sponsors subsequently increase out-of-pocket costs by 1% in the following year.
