- id: changes-rail-rates-commodity
  title: Changes in Rail Rates for U.S. Commodity Grain Shipments Over Time
  section: Journal Articles
  status: published
  accepted: 2023-09-14
  authors:
  - miller
  - wesley-w-wilson
  outlet: Research in Transportation Economics
  volume: 102
  pages: '101359'
  year: 2023
  links:
  - label: Published version
    url: https://www.sciencedirect.com/science/article/abs/pii/S0739885923000999
  abstract_heading: Abstract
  abstract: |-
    The deregulation of the U.S. railroad industry has largely been considered a success, as costs and rates have fallen due to changes in the mix of traffic and industry consolidation. However, rates did not fall as quickly as costs, and since 2000 rates have been rising while many measures of cost have remained relatively stable. We investigate these changes in rail rates using a sample of agricultural shipments from 2000–2016. We provide evidence that even after controlling for changes in cost drivers such as fuel, the relationships between prices and determinants have changed over time, suggesting that railroad pricing rules have driven increases in rates faced by shippers.
- id: medicare-advantage-benchmark-reduction
  title: Reducing Medicare Advantage Benchmarks Will Decrease Plan Generosity, But Those Effects Will Likely Be Modest
  section: Journal Articles
  status: published
  accepted: 2023-02-08
  authors:
  - michael-chernew
  - miller
  - amil-petrin
  - robert-town
  outlet: Health Affairs
  volume: 42
  issue: 4
  pages: 479–487
  year: 2023
  links:
  - label: Published version
    url: https://www.healthaffairs.org/doi/abs/10.1377/hlthaff.2022.01031
  abstract_heading: Abstract
  abstract: |-
    Concerns that Medicare Advantage (MA) plans are overpaid have motivated calls to reduce MA benchmarks, the dollar amounts set by the Centers for Medicare and Medicaid Services (CMS) against which MA plans bid to set premiums and fund extra benefits. However, cutting benchmarks may lead to higher MA enrollee premiums and decreased plan generosity. We assessed the relationships between MA benchmarks and plan generosity and benefits. We estimated that a $1,000 per year decrease in benchmarks would lead to small increases in annual premiums of about $60 and increases in annual deductibles of about $27. Copays would also increase modestly, and the propensity to offer benefits would generally decline by less than 5 percentage points, with the greatest impact being on the availability of dental, hearing, and vision benefits. These results suggest that although cuts to MA benchmarks would adversely affect plan generosity, those effects would be modest.
- id: cannabis-labor-spillovers
  title: 'Watching the Grass Grow: Does Recreational Cannabis Legalization Affect Retail and Agricultural Wages?'
  section: Journal Articles
  status: published
  accepted: 2022-07-04
  authors:
  - sichao-jiang
  - miller
  outlet: Journal of Cannabis Research
  volume: 4
  issue: 1
  pages: '42'
  year: 2022
  links:
  - label: Published version
    url: https://jcannabisresearch.biomedcentral.com/articles/10.1186/s42238-022-00149-6
  - label: Paper
    url: s/2022-01-27-cannabis-wages-resubmission.pdf
    note: (January 2022 draft)
  abstract_heading: Abstract
  abstract: |-
    **Background.** Over the past several years, cannabis has become legal for recreational use in many US states and jurisdictions around the world. The opening of these markets has led to the establishment of hundreds of cannabis production and retail firms with accompanying demand for labor, leading to concerns about spillover effects on wages from incumbents.

    **Methods.** We study the markets for agricultural and retail labor in Washington and Colorado from 2000 to 2019 using differences-in-differences with synthetic controls. We employ employment data from the Quarterly Census of Employment and Wages, state-level demographic data from the US Census Bureau, and agricultural data from the National Agricultural Statistics Service. We use the least absolute shrinkage and selection operator (LASSO) for variable selection and classification and regression trees (CART) for chained imputation of missing values.

    **Results.** We find little-to-no evidence of a significant difference in weekly wages per worker generated by cannabis legalization: the log of the weekly wage per worker decreases by 0.013 in Washington’s agricultural sector (p value 0.091) and increases by 0.059 in Washington’s retail sector (p value 0.606). Results in Colorado are qualitatively similar. These results are limited in part by the short post-legalization period of the data.

    **Conclusions.** Cannabis legalization is unlikely to negatively impact incumbent agriculture or retail firms through the labor market channel.
- id: grt-vertical-integration
  title: Vertical Integration and Production Inefficiency in the Presence of a Gross Receipts Tax
  section: Journal Articles
  status: published
  accepted: 2022-06-03
  authors:
  - benjamin-hansen
  - miller
  - caroline-weber
  outlet: Journal of Public Economics
  volume: 212
  pages: '104693'
  year: 2022
  links:
  - label: Published version
    url: https://www.sciencedirect.com/science/article/pii/S0047272722000950?dgcid=author
  - label: NBER Working Paper
    url: https://www.nber.org/papers/w28478
  abstract_heading: Abstract
  abstract: |-
    We quantify the effects of a gross receipts tax (GRT) on vertical integration for the first time. We use data from the Washington state recreational cannabis industry, which has numerous advantages including a clean natural experiment: a 25% GRT imposed on cannabis firms was subsequently replaced by an excise tax at retail. We find the short-run elasticity of vertical integration with respect to the intermediate good net-of-tax rate is −0.15 and the long-run elasticity is about twice as large. We find these incentives lead to large output losses – production increases by 23 percent when the GRT is eliminated.
- id: cannabis-alcohol-tobacco
  title: The Effect of Cannabis Legalization on Substance Demand and Tax Revenues
  section: Journal Articles
  status: published
  accepted: 2020-09-29
  authors:
  - miller
  - boyoung-seo
  outlet: National Tax Journal
  volume: 74
  issue: 1
  pages: 107–145
  year: 2021
  links:
  - label: Published version
    url: https://www.journals.uchicago.edu/doi/abs/10.1086/712915?journalCode=ntj
  - label: Paper
    url: s/2019-01-05-tax-revenues-substances-RESTAT.pdf
    note: (January 2019 draft)
  - label: News coverage in the Wall Street Journal
    url: https://www.wsj.com/articles/companies-betting-on-pot-may-be-worse-off-when-the-smoke-clears-1539338460
  abstract_heading: Abstract
  abstract: |-
    Cannabis advocates argue that legalization will increase tax revenues. However, if legal substances are substitutes, cannabis revenues may cannibalize other taxes. We document substitution between legal cannabis products and alcohol and tobacco products using detailed administrative and scanner data from Washington State. We estimate a flexible demand system for legal substances and find legalizing cannabis leads to a 15 percent decrease in alcohol, mainly by liquor and wine, and 5 percent decrease in cigarette demand. Approximately 40 percent of Washington’s 2015 cannabis revenue was cannibalized from preexisting sources. We find that Washington’s current substance taxes, even after accounting for substitution, are on the upward-sloping side of the Laffer curve.
- id: cannabis-cross-border
  title: 'Federalism, Partial Prohibition, and Cross-Border Sales: Evidence from Recreational Marijuana'
  section: Journal Articles
  status: published
  accepted: 2020-02-13
  authors:
  - benjamin-hansen
  - miller
  - caroline-weber
  outlet: Journal of Public Economics
  volume: 187
  pages: '104159'
  year: 2020
  links:
  - label: Published version
    url: https://www.sciencedirect.com/science/article/abs/pii/S0047272720300232
  abstract_heading: Abstract
  abstract: |-
    Marijuana is partially prohibited: though banned federally, it is available to 1 in 4 U.S. adults under state statutes. We measure the size of the interstate trade generated by state-level differences in legal status with a natural experiment: Oregon allowed stores to sell marijuana for recreational use on October 1, 2015, next to Washington where stores had been selling recreational marijuana since July 2014. Using administrative data covering the universe of Washington's sales and a differences-in-discontinuities approach, we find retailers along the Oregon border experienced a 36% decline in sales immediately after Oregon's market opened. We investigate the home location of recent online reviewers of marijuana retailers and find similar cross-border patterns. By the end of Washington's 2018 fiscal year, our results imply that Washington had earned between $44 million and $75 million in tax revenue from cross-border shoppers. These cross-border incentives may create a “race to legalize.”
- id: sharing-sacrifice-minimizing-pain
  title: 'Sharing the Sacrifice, Minimizing the Pain: Optimal Wage Reductions'
  section: Journal Articles
  status: published
  accepted: 2020-08-19
  outlet: Economics Letters
  volume: 196
  pages: '109503'
  year: 2020
  links:
  - label: Published version
    url: https://www.sciencedirect.com/science/article/abs/pii/S0165176520303086
  - label: Paper
    url: s/2020-08-17-revision-full-manuscript.pdf
    note: (August 2020 draft)
  abstract_heading: Abstract
  abstract: |-
    Faced with temporary revenue shocks, employers may implement wage reductions — a common response to COVID-19 for U.S. universities. I provide a framework for optimal reductions when labor is inelastic wherein a planner balances “minimizing the pain” and “sharing the sacrifice.” I show that for a broad class of utility functions the optimal schedule includes (1) a cutoff wage below which the reduction is zero and (2) weakly progressive reduction rates above the cutoff wage. I illustrate the results using data from a large U.S. university.
