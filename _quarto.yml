project:
  type: website
  output-dir: _site
  # research.qmd is generated from data/*.yml. Editing it directly does
  # nothing lasting -- this step overwrites it on every render.
  pre-render: python3 scripts/build.py
  # Legacy Squarespace files: always ship s/ so old /s/<file> URLs resolve,
  # even for files no page links to (e.g. the Monte Carlo zip).
  resources:
    - s/

website:
  title: "Keaton Miller"
  description: "Associate Professor of Economics and Director of Graduate Studies, University of Oregon"
  # Drives the sitemap, canonical URLs, and absolute image URLs in link
  # previews.
  site-url: https://keatonmiller.org
  favicon: assets/img/favicon.ico
  image: assets/img/headshot.jpg
  open-graph: true
  twitter-card: true
  google-analytics:
    tracking-id: "G-Z0XFT68NXD"
    anonymize-ip: true
  cookie-consent:
    type: express
    style: simple
    palette: light
  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: teaching.qmd
        text: Teaching
      - href: students.qmd
        text: For Students
      - href: assets/pdf/Keaton-Miller-CV.pdf
        text: CV
  page-footer:
    center: |
      © 2026 Keaton Miller · Department of Economics, University of Oregon

format:
  html:
    theme: [cosmo, theme.scss]
    toc: false
    link-external-newwindow: true
    # Replaces the bundled consent widget's stock ad-centric wording.
    include-after-body: _includes/cookie-consent-text.html
