  abstract_heading: Abstract
  abstract: |-
    Cannabis is legal to purchase for over 28 percent of U.S. citizens. A central argument used in public campaigns for cannabis legalization has focused on the tax revenue that legal cannabis markets could generate. Recently, some policy makers and politicians have debated switching from traditional ad valorem taxes to taxes on potency, aiming to reduce the potential externalities associated with highly potent products. In this paper, we construct a theoretical model to predict the implications of a potency-based tax in an environment with market power. We then estimate the demand for cannabis potency based on administrative records of sales and potency from Washington state. We finish by conducting counterfactual analyses comparing revenue and potency outcomes from potency-based taxes versus the traditional price-based taxes.
- id: c4c-trifecta
  title: 'Environmentalism, Stimulus, and Inequality Reduction Through Industrial Policy: Did Cash for Clunkers Achieve the Trifecta?'
  section: Journal Articles
  status: published
  accepted: 2020-01-22
  authors:
  - miller
  - wesley-w-wilson
  - nick-wood
  outlet: Economic Inquiry
  volume: 58
  issue: 3
  pages: 1109–1128
  year: 2020
  links:
  - label: Published version
    url: https://onlinelibrary.wiley.com/doi/abs/10.1111/ecin.12889
  abstract_heading: Abstract
  abstract: |-
    The 2009 American Cash for Clunkers program, which subsidized consumers who scrapped old vehicles and purchased new vehicles, was promoted by appealing to multiple constituencies. We evaluate the policy and alternatives according to its stated goals: emissions reductions, economic stimulus, and reducing inequality. We calibrate a dynamic partial equilibrium portfolio model to match consumer expenditure data from 1998 to 2011 focusing on heterogeneity across cars and trucks. We find the program generated $0.17 in environmental benefits, $0.28 in consumer surplus, and $0.31 in net discounted additional spending per subsidy dollar. Since subsidies largely went to middle-income infra-marginal consumers, the program exacerbated consumption inequality. We evaluate alternative policy designs and find no policy which simultaneously improves all outcomes.
- id: cannabis-traffic-fatalities
  title: Early Evidence on Recreational Marijuana Legalization and Traffic Fatalities
  section: Journal Articles
  status: published
  authors:
  - benjamin-hansen
  - miller
  - caroline-weber
  outlet: Economic Inquiry
  volume: 58
  issue: 2
  pages: 547–568
  year: 2020
  links:
  - label: Published version
    url: https://onlinelibrary.wiley.com/doi/10.1111/ecin.12751
  abstract_heading: Abstract
  abstract: |-
    Over the last few years, marijuana has become legally available for recreational use to roughly a quarter of Americans. Policy makers have long expressed concerns about the substantial external costs of alcohol, and similar costs could come with the liberalization of marijuana policy. Indeed, the fraction of fatal accidents in which at least one driver tested positive for tetrahydrocannabinol has increased nationwide by an average of 10% from 2013 to 2016. For Colorado and Washington, both of which legalized marijuana in 2014, these increases were 92% and 28%, respectively. However, identifying a causal effect is difficult due to the presence of significant confounding factors. We test for a causal effect of marijuana legalization on traffic fatalities in Colorado and Washington with a synthetic control approach using records on fatal traffic accidents from 2000 to 2016. We find the synthetic control groups saw similar changes in marijuana-related, alcohol-related, and overall traffic fatality rates despite not legalizing recreational marijuana. ( JEL K42, I12, I18)
- id: governance-structure-exit-hospitals
  title: 'Governance Structure and Exit: Evidence from California Hospitals'
  section: Journal Articles
  status: published
  authors:
  - miller
  - wesley-w-wilson
  outlet: Review of Industrial Organization
  volume: 53
  issue: 1
  pages: 31–55
  year: 2018
  links:
  - label: Published version
    url: https://link.springer.com/article/10.1007/s11151-017-9595-7
  abstract_heading: Abstract
  abstract: |-
    Most inpatient and emergency health care services in the U.S. are delivered by non-profit organizations. To understand the impact of policies that are designed to affect competitive outcomes in hospital markets, it's important to understand whether the "non-profit" structure changes the behavior and competitive conduct of firms. Given the complexity of the product space within which hospitals operate, we focus on more easily interpreted decisions within the hospital market: entry and exit. Using comprehensive administrative data for the universe of California hospitals from 1980 to 2013, we document the observed entry and exit behavior. We estimate flexible exit policy functions and demonstrate a difference in behavior between for-profit and non-profit firms that exists after accounting for several observable characteristics of hospitals. We find differences in observed behavior: this is a finding that strongly suggests that there are differences in the underlying objective function of the various firms.
- id: medicare-advantage-handbook
  title: Medicare Advantage
  section: Book Chapters
