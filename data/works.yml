  links:
  - label: Published version
    url: https://www.elgaronline.com/abstract/book/9781802200546/chapter52.xml
  abstract_heading: Abstract
  abstract: |-
    The public–private partnership currently called "Medicare Advantage" has grown and changed considerably since the first trials of "Medicare Part C" in 1982; today it covers roughly half of eligible seniors in the United States. In this chapter, I provide an overview of the current iteration of the program and its funding structure. I summarize recent research on competition within the program, the potential for cost efficiencies, risk adjustment, and quality comparisons between plans offered within the program and the traditional fee-for-service Medicare system.
