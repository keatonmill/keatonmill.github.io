  links:
  - label: Report
    url: https://www.oregonforce.org/s/economic-cost-of-climate-change-oregonians.pdf
  abstract_heading: Summary
  abstract: |-
    By increasing the frequency and intensity of heatwaves, wildfires, droughts, flooding and other impacts, climate change imposes costs on Oregon's economy every year, on every Oregonian. We present a review of public data and research results to provide an initial, partial assessment of these costs both today and into the future.
