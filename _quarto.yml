project:
  type: website
  output-dir: _site
  # Legacy Squarespace files: always ship s/ so old /s/<file> URLs resolve,
  # even for files no page links to (e.g. the Monte Carlo zip).
  resources:
    - s/

website:
  title: "Keaton Miller"
  description: "Associate Professor of Economics and Director of Graduate Studies, University of Oregon"
  # Switch to https://keatonmiller.org at the DNS cutover. Drives the sitemap,
  # canonical URLs, and absolute image URLs in link previews.
  site-url: https://keatonmill.github.io
  favicon: assets/img/favicon.ico
  image: assets/img/headshot.jpg
  open-graph: true
  twitter-card: true
  # Analytics: paste a GA4 measurement ID (G-XXXXXXXXXX) to enable.
  # google-analytics: "G-XXXXXXXXXX"
  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: teaching.qmd
        text: Teaching
      - href: students.qmd
        text: For Students
      - href: assets/pdf/Keaton-Miller-CV.pdf
        text: CV
  page-footer:
    center: |
      © 2026 Keaton Miller · Department of Economics, University of Oregon

format:
  html:
    theme: [cosmo, theme.scss]
    toc: false
    link-external-newwindow: true
